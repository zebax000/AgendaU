<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgendaU</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/classes.css">
</head>
<body>
  <aside id="classes-zone">
    <h2>Clases</h2>
  </aside>

  <main id="notes-zone">
    <section id="notes-view">
      <header class="notes-header">
        <h1>Notas</h1>
        <button type="button" id="new-note-btn">+ Nueva nota</button>
      </header>
      <ul id="notes-list"></ul>
    </section>

    <section id="note-panel" hidden></section>
  </main>

  <dialog id="note-dialog">
    <form id="note-form">
      <p class="bot-message">¿Cómo se llama la nota?</p>
      <input type="text" id="note-title" maxlength="100" placeholder="Título" required>
      <p class="bot-message">¿Cuál es la fecha límite y la hora?</p>
      <div class="deadline-row">
        <input type="date" id="note-date" required>
        <div class="time-field">
          <input type="text" id="note-time" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Hora, ej. 14:30" required>
          <span class="time-hint" id="note-time-hint"></span>
        </div>
      </div>
      <div class="dialog-actions">
        <button type="button" id="note-cancel">Cancelar</button>
        <button type="submit">Crear nota</button>
      </div>
    </form>
  </dialog>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/classes.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
